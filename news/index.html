<style>
.nw-page{min-height:100vh;display:flex;flex-direction:column}
.nw-main{flex:1;width:min(1040px,92vw);margin:0 auto;padding:clamp(24px,5vw,48px) 0 80px}

.nw-title{font-family:var(--display);font-size:clamp(2rem,6vw,2.8rem);line-height:1.05}
.nw-lang{display:flex;gap:6px;border:1px solid var(--line);border-radius:8px;padding:4px}

</style>

<body>

<script>
const SUPABASE_URL = "https://qxfcwsiysnjxhxljqigl.supabase.co";
// იგივე საჯარო anon key, რასაც app.js/admin.html იყენებს.
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4ZmN3c2l5c25qeGh4bGpxaWdsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxODM4MDUsImV4cCI6MjA5Nzc1OTgwNX0.SOeTrxnKulgO8ao8HSwxyKE-m9pvaQ54Pa_IGWWyKDc";

// Simple, news-section-only KA/EN toggle. Not related to any
// site-wide i18n mechanism -- Phase C5 (site-wide translation +
// language switcher) hasn't started yet, so there's nothing to reuse.
// Persisted via localStorage so it carries from here into the article
// detail page, but touches nothing outside /news/.
const NW_LANG_KEY = 'fnf_news_lang';
function nwGetLang() { try { return localStorage.getItem(NW_LANG_KEY) || 'ka'; } catch (e) { return 'ka'; } }
function nwSetLang(l) { try { localStorage.setItem(NW_LANG_KEY, l); } catch (e) {} }

function nwStripHtml(html) {
  const d = document.createElement('div');
  d.innerHTML = html || '';
  return d.textContent || '';
}
function nwTitleFor(a, lang) { return (lang === 'en' && a.title_en) ? a.title_en : a.title_ka; }
function nwExcerptFor(a, lang) {
  const meta = lang === 'en' ? a.meta_description_en : a.meta_description_ka;
  if (meta) return meta;
  const body = (lang === 'en' && a.body_en) ? a.body_en : a.body_ka;
  const text = nwStripHtml(body).trim();
  return text.length > 160 ? text.slice(0, 160).trim() + '…' : text;
}
function nwCoverAltFor(a, lang) {
  const alt = lang === 'en' ? a.cover_image_alt_en : a.cover_image_alt_ka;
  return alt || nwTitleFor(a, lang);
}

let nwArticles = [];

function nwRender() {
  const lang = nwGetLang();
  document.querySelectorAll('#nwLang button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));

  const grid = document.getElementById('nwGrid');
  if (!nwArticles.length) { grid.innerHTML = '<div class="nw-empty">სტატია ჯერ არ არის</div>'; return; }

  grid.innerHTML = nwArticles.map(a => {
    const dateStr = a.published_at
      ? new Date(a.published_at).toLocaleDateString(lang === 'en' ? 'en-US' : 'ka-GE', { year: 'numeric', month: 'short', day: 'numeric' })
      : '';
    const img = a.cover_image_url
      ? `<img class="nw-card-img" src="${a.cover_image_url}" alt="${nwCoverAltFor(a, lang).replace(/"/g, '&quot;')}" loading="lazy" />`
      : '';
    return `
    <a class="nw-card" href="/news/post.html?slug=${encodeURIComponent(a.slug)}">
      ${img}
      <div class="nw-card-body">
        <div class="nw-card-title">${nwTitleFor(a, lang)}</div>
        <div class="nw-card-excerpt">${nwExcerptFor(a, lang)}</div>
        <div class="nw-card-meta">${[a.author, dateStr].filter(Boolean).join(' · ')}</div>
      </div>
    </a>`;
  }).join('');
}

document.getElementById('nwLang').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-lang]');
  if (!btn) return;
  nwSetLang(btn.dataset.lang);
  nwRender();
});

async function nwLoad() {
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  // RLS (news_select_published policy, supabase/news_table.sql) already
  // restricts anon reads to is_published=true -- the explicit filter
  // here is just defense-in-depth / clarity, not the real gate.
  const { data, error } = await sb
    .from('news')
    .select('title_ka,title_en,slug,cover_image_url,cover_image_alt_ka,cover_image_alt_en,meta_description_ka,meta_description_en,body_ka,body_en,published_at,author')
    .eq('is_published', true)
    .order('published_at', { ascending: false });

  if (error) { document.getElementById('nwGrid').innerHTML = `<div class="nw-empty">შეცდომა: ${error.message}</div>`; return; }
  nwArticles = data || [];
  nwRender();
}

document.addEventListener('DOMContentLoaded', nwLoad);
</script>
