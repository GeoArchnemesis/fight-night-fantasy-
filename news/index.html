<style>
.nw-page{min-height:100vh;display:flex;flex-direction:column}
.nw-main{flex:1;width:min(1040px,92vw);margin:0 auto;padding:clamp(24px,5vw,48px) 0 80px}
.nw-head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:28px}

.nw-card:hover{transform:translateY(-3px);border-color:var(--gold)}
.nw-card-img{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--surface-2,#1a1826);display:block}
.nw-card-body{padding:16px}
.nw-card-title{font-family:var(--display);font-weight:700;font-size:1.3rem;line-height:1.18;margin-bottom:8px;color:var(--text)}
.nw-card-meta{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em}
.nw-card-stats{display:flex;align-items:center;gap:14px;margin-top:8px;color:var(--muted);font-size:.78rem}
.nw-card-stat{display:inline-flex;align-items:center;gap:5px}
.nw-card-share{position:absolute;top:10px;right:10px;z-index:2;background:rgba(14,13,20,.72);backdrop-filter:blur(2px);border:1px solid var(--line);border-radius:50%;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:.95rem;cursor:pointer}
.nw-card-share:hover{border-color:var(--gold)}
.nw-share-pop-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;display:none;align-items:center;justify-content:center;padding:20px}
.nw-share-pop-bg.show{display:flex}
.nw-share-pop{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:320px;width:100%}
.nw-share-pop h3{font-size:1rem;margin-bottom:14px;color:var(--text)}
.nw-share-opt{display:flex;align-items:center;gap:10px;width:100%;background:var(--canvas);border:1px solid var(--line);border-radius:8px;padding:10px 14px;color:var(--text);font-size:.9rem;font-family:inherit;cursor:pointer;margin-bottom:8px;text-decoration:none;box-sizing:border-box}
.nw-share-opt:hover{border-color:var(--muted)}
.nw-share-copy-status{margin-left:auto;color:var(--green);font-size:.78rem}
.nw-share-close{width:100%;background:none;border:1px solid var(--line);border-radius:8px;padding:9px;color:var(--muted);font-family:inherit;font-size:.85rem;cursor:pointer}
.nw-empty, .nw-loading{color:var(--muted);font-size:.9rem;padding:40px 0;text-align:center}

<script>
const SUPABASE_URL = "https://qxfcwsiysnjxhxljqigl.supabase.co";
// იგივე საჯარო anon key, რასაც app.js/admin.html იყენებს.
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4ZmN3c2l5c25qeGh4bGpxaWdsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxODM4MDUsImV4cCI6MjA5Nzc1OTgwNX0.SOeTrxnKulgO8ao8HSwxyKE-m9pvaQ54Pa_IGWWyKDc";

// Simple, news-section-only KA/EN toggle. Not related to any
// site-wide i18n mechanism -- Phase C5 (site-wide translation +
// language switcher) hasn't started yet, so there's nothing to reuse.
// Persisted via localStorage so it carries from here into the article
// detail page, but touches nothing outside /news/.
const NW_LANG_KEY = 'fnf_news_lang';
function nwGetLang() { try { return localStorage.getItem(NW_LANG_KEY) || 'ka'; } catch (e) { return 'ka'; } }
function nwSetLang(l) { try { localStorage.setItem(NW_LANG_KEY, l); } catch (e) {} }

function nwTitleFor(a, lang) { return (lang === 'en' && a.title_en) ? a.title_en : a.title_ka; }
function nwCoverAltFor(a, lang) {
  const alt = lang === 'en' ? a.cover_image_alt_en : a.cover_image_alt_ka;
  return alt || nwTitleFor(a, lang);
}
// Embedded aggregate counts from the select() below -- PostgREST returns
// these as a one-element array ([{count:N}]), not a bare number, even
// though it's always exactly one row per article.
function nwLikeCount(a) { return (a.news_reactions && a.news_reactions[0] && a.news_reactions[0].count) || 0; }
function nwCommentCount(a) { return (a.news_comments && a.news_comments[0] && a.news_comments[0].count) || 0; }

let nwArticles = [];

function nwRender() {
  const lang = nwGetLang();
  document.querySelectorAll('#nwLang button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));

  const grid = document.getElementById('nwGrid');
  if (!nwArticles.length) { grid.innerHTML = '<div class="nw-empty">სტატია ჯერ არ არის</div>'; return; }

  grid.innerHTML = nwArticles.map(a => {
    const dateStr = a.published_at
      ? new Date(a.published_at).toLocaleDateString(lang === 'en' ? 'en-US' : 'ka-GE', { year: 'numeric', month: 'short', day: 'numeric' })
      : '';
    const img = a.cover_image_url
      ? `<img class="nw-card-img" src="${a.cover_image_url}" alt="${nwCoverAltFor(a, lang).replace(/"/g, '&quot;')}" loading="lazy" />`
      : '';
    return `
    <div class="nw-card-wrap">
      <a class="nw-card" href="/news/post.html?slug=${encodeURIComponent(a.slug)}">
        ${img}
        <div class="nw-card-body">
          <div class="nw-card-title">${nwTitleFor(a, lang)}</div>
          <div class="nw-card-meta">${dateStr}</div>
          <div class="nw-card-stats">
            <span class="nw-card-stat">👍 <span>${nwLikeCount(a)}</span></span>
            <span class="nw-card-stat">💬 <span>${nwCommentCount(a)}</span></span>
          </div>
        </div>
      </a>
      <button type="button" class="nw-card-share" data-share-slug="${a.slug}" title="გაზიარება" aria-label="გაზიარება">↗</button>
    </div>`;
  }).join('');
}

document.getElementById('nwLang').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-lang]');
  if (!btn) return;
  nwSetLang(btn.dataset.lang);
  nwRender();
});

// ─────────────────────────────────────────────────────────────
//  SHARE — delegated at the grid level (same pattern as the #nwLang
//  listener above) rather than one inline onclick per card: slugs are
//  DB-constrained to [a-z0-9-] (news_table.sql's slug format check),
//  so a data-attribute lookup is both safe and simpler than escaping
//  arbitrary article titles into an inline onclick string.
// ─────────────────────────────────────────────────────────────
document.getElementById('nwGrid').addEventListener('click', (e) => {
  const btn = e.target.closest('.nw-card-share');
  if (!btn) return;
  e.preventDefault();
  e.stopPropagation();
  const art = nwArticles.find(a => a.slug === btn.dataset.shareSlug);
  if (!art) return;
  const url = `${location.origin}/news/post.html?slug=${encodeURIComponent(art.slug)}`;
  nwShare(url, nwTitleFor(art, nwGetLang()));
});

// Web Share API first (native share sheet -- Messenger/Instagram/
// WhatsApp/Telegram all show up automatically there if installed,
// nothing to build per-platform). Falls back to a custom popover only
// when unsupported or the share itself fails for a reason other than
// the user cancelling.
async function nwShare(url, title) {
  const data = { title, url };
  if (navigator.share && (!navigator.canShare || navigator.canShare(data))) {
    try { await navigator.share(data); return; } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  nwOpenSharePopover(url, title);
}

function nwOpenSharePopover(url, title) {
  document.getElementById('nwShareCopyStatus').textContent = '';
  document.getElementById('nwShareWhatsapp').href = 'https://wa.me/?text=' + encodeURIComponent(title + ' ' + url);
  document.getElementById('nwShareTelegram').href = 'https://t.me/share/url?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(title);
  document.getElementById('nwSharePopBg').dataset.url = url;
  document.getElementById('nwSharePopBg').classList.add('show');
}
function nwCloseSharePopover() {
  document.getElementById('nwSharePopBg').classList.remove('show');
}
async function nwCopyShareLink() {
  const url = document.getElementById('nwSharePopBg').dataset.url || '';
  const statusEl = document.getElementById('nwShareCopyStatus');
  try {
    await navigator.clipboard.writeText(url);
    statusEl.textContent = 'კოპირებულია ✓';
  } catch (e) {
    // Clipboard API needs a secure context/permission and isn't
    // available everywhere -- execCommand('copy') via a throwaway
    // textarea is the standard fallback.
    const ta = document.createElement('textarea');
    ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); statusEl.textContent = 'კოპირებულია ✓'; }
    catch (e2) { statusEl.textContent = 'ვერ დაკოპირდა'; }
    document.body.removeChild(ta);
  }
}

async function nwLoad() {
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  // RLS (news_select_published policy, supabase/news_table.sql) already
  // restricts anon reads to is_published=true -- the explicit filter
  // here is just defense-in-depth / clarity, not the real gate.
  // news_reactions!left(count) / news_comments!left(count) are
  // PostgREST embedded aggregate counts, not per-article round-trips --
  // !left keeps articles with zero likes/comments in the result (a
  // filtered embed defaults to an inner join, which would otherwise
  // drop them). news_comments RLS (news_comments_select_public) already
  // restricts anon reads to is_deleted=false, so counting it needs no
  // extra filter; news_reactions has no such restriction, hence the
  // explicit reaction=eq.like filter below to count likes only (not
  // dislikes). Categories/excerpt/author aren't fetched here any more
  // -- the card no longer shows them (post.html still has its own
  // independent query for the full article view).
  const { data, error } = await sb
    .from('news')
    .select('id,title_ka,title_en,slug,cover_image_url,cover_image_alt_ka,cover_image_alt_en,published_at,news_reactions!left(count),news_comments!left(count)')
    .eq('is_published', true)
    .eq('news_reactions.reaction', 'like')
    .order('published_at', { ascending: false });

  if (error) { document.getElementById('nwGrid').innerHTML = `<div class="nw-empty">შეცდომა: ${error.message}</div>`; return; }
  nwArticles = data || [];
  nwRender();
}

document.addEventListener('DOMContentLoaded', nwLoad);
</script>
