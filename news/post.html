.nw-comment-signin input{flex:1 1 180px;background:var(--canvas);border:1px solid var(--line);border-radius:4px;padding:10px 12px;color:var(--text);font-size:.9rem;font-family:inherit}

<body>

<script>
const SUPABASE_URL = "https://qxfcwsiysnjxhxljqigl.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4ZmN3c2l5c25qeGh4bGpxaWdsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxODM4MDUsImV4cCI6MjA5Nzc1OTgwNX0.SOeTrxnKulgO8ao8HSwxyKE-m9pvaQ54Pa_IGWWyKDc";

const NW_LANG_KEY = 'fnf_news_lang';
function nwGetLang() { try { return localStorage.getItem(NW_LANG_KEY) || 'ka'; } catch (e) { return 'ka'; } }
function nwSetLang(l) { try { localStorage.setItem(NW_LANG_KEY, l); } catch (e) {} }

// Single shared client for the whole page (article load, auth,
// comments, reactions) -- this page previously created a throwaway
// client inside nwLoad() only, which worked for the one-off article
// fetch but can't be reused for auth/session handling elsewhere.
// Session persistence is supabase-js's default (persistSession +
// autoRefreshToken + detectSessionInUrl all on) and is scoped to this
// origin's localStorage -- not to this page -- so a session created
// by signing in on /ufc/ (app.js) is already present here with no
// extra wiring.
let sb;
function nwGetClient() {
  if (!sb) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  return sb;
}

function nwEscapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

let nwArticle = null;

function nwRenderArticle() {
  const a = nwArticle;
  const lang = nwGetLang();
  const hasEn = !!(a.title_en && a.body_en);
  const effectiveLang = (lang === 'en' && hasEn) ? 'en' : 'ka';

  const title = effectiveLang === 'en' ? a.title_en : a.title_ka;
  const body  = effectiveLang === 'en' ? a.body_en  : a.body_ka;
  const alt   = (effectiveLang === 'en' ? a.cover_image_alt_en : a.cover_image_alt_ka) || title;

  document.getElementById('nwTitleTag').textContent = `${title} — Fight Night Fantasy`;
  const metaDesc = (effectiveLang === 'en' ? a.meta_description_en : a.meta_description_ka) || '';
  document.getElementById('nwDescTag').setAttribute('content', metaDesc || `Fight Night Fantasy — ${title}`);

  const dateStr = a.published_at
    ? new Date(a.published_at).toLocaleDateString(effectiveLang === 'en' ? 'en-US' : 'ka-GE', { year: 'numeric', month: 'long', day: 'numeric' })
    : '';

  const fallbackNote = (lang === 'en' && !hasEn)
    ? `<div class="nw-art-fallback-note">ეს სტატია ჯერ არ არის თარგმნილი ინგლისურად — ნაჩვენებია ქართული ვერსია. / This article isn't translated to English yet — showing the Georgian version.</div>`
    : '';

  const cats = (a.news_article_categories || []).map(x => x.news_categories).filter(Boolean);
  const chipsHtml = cats.length
    ? `<div class="nw-chips">${cats.map(c => `<span class="nw-chip">${(effectiveLang === 'en' && c.name_en) ? c.name_en : c.name_ka}</span>`).join('')}</div>`
    : '';

  document.getElementById('nwArt').innerHTML = `
    <a class="nw-back" href="/news/">← სიახლეები</a>
    <div class="nw-lang" id="nwLang">
      <button type="button" data-lang="ka">ქართ</button>
      <button type="button" data-lang="en">Eng</button>
    </div>
    ${fallbackNote}
    ${chipsHtml}
    <h1 class="nw-art-title">${title}</h1>
    <div class="nw-art-meta">${[a.author, dateStr].filter(Boolean).join(' · ')}</div>
    ${a.cover_image_url ? `<img class="nw-art-cover" src="${a.cover_image_url}" alt="${alt.replace(/"/g, '&quot;')}" />` : ''}
    <div class="nw-art-body">${body}</div>
  `;
  document.querySelectorAll('#nwLang button').forEach(b => {
    b.classList.toggle('on', b.dataset.lang === lang);
    b.onclick = () => { nwSetLang(b.dataset.lang); nwRenderArticle(); };
  });

  nwInjectJsonLd(a);
}

// Article JSON-LD always describes the Georgian (primary, guaranteed-
// present) version regardless of the client-side language toggle --
// this is injected via JS either way since the article content itself
// is only known after the Supabase fetch completes (no SSR yet, see
// the commit message), so there's no server-rendered alternative a
// non-JS crawler would see instead.
function nwInjectJsonLd(a) {
  const ld = {
    "@context": "https://schema.org",
    "@type": "Article",
    "headline": a.title_ka,
    "datePublished": a.published_at || undefined,
    "image": a.cover_image_url || undefined,
  };
  if (a.author) ld.author = { "@type": "Person", "name": a.author };
  const script = document.createElement('script');
  script.type = 'application/ld+json';
  script.textContent = JSON.stringify(ld);
  document.head.appendChild(script);
}

// ─────────────────────────────────────────────────────────────
//  COMMENTS — login required (same sb.auth account system as
//  /ufc/'s app.js, decision confirmed by Giorgi). Non-threaded,
//  soft-delete only -- see supabase/news_comments.sql.
// ─────────────────────────────────────────────────────────────
let nwCurrentUser = null; // { id, nick, isAdmin } | null
let nwComments = [];
let nwCommenterNames = {}; // user_id -> nick, from the news_commenter_names view

async function nwInitComments() {
  const client = nwGetClient();
  const { data: { session } } = await client.auth.getSession();
  await nwApplyAuthState(session);
  client.auth.onAuthStateChange((event, session) => { nwApplyAuthState(session); });
  await nwLoadComments();
}

// Mirrors the is_admin lookup admin/news.html already does at login
// (sb.from('users').select('is_admin').eq('id', <own id>)) -- a user
// reading their own row is an already-working, established pattern
// in this project; reading another user's row is not (see
// news_comments.sql's note on why nick lookups go through a view).
async function nwApplyAuthState(session) {
  if (session && session.user) {
    let nick = (session.user.email || '').split('@')[0];
    let isAdmin = false;
    try {
      const { data: ud } = await nwGetClient().from('users').select('nick,is_admin').eq('id', session.user.id).maybeSingle();
      if (ud?.nick) nick = ud.nick;
      isAdmin = !!ud?.is_admin;
    } catch (e) {}
    nwCurrentUser = { id: session.user.id, nick, isAdmin };
  } else {
    nwCurrentUser = null;
  }
  nwRenderCommentAuthArea();
  nwRenderComments();
}

function nwRenderCommentAuthArea() {
  const box = document.getElementById('nwCommentAuthArea');
  if (!box) return;
  if (nwCurrentUser) {
    box.innerHTML = `
      <div class="nw-comment-form">
        <textarea id="nwCommentInput" maxlength="1000" placeholder="დაწერე კომენტარი..."></textarea>
        <div class="nw-comment-form-row">
          <span class="nw-comment-count" id="nwCommentCharCount">0 / 1000</span>
          <button type="button" class="btn btn-primary" id="nwCommentSubmit" onclick="nwSubmitComment()">კომენტარის დამატება</button>
        </div>
        <div class="nw-comment-error" id="nwCommentFormError"></div>
      </div>`;
    const input = document.getElementById('nwCommentInput');
    input.addEventListener('input', () => {
      document.getElementById('nwCommentCharCount').textContent = `${input.value.length} / 1000`;
    });
  } else {
    box.innerHTML = `
      <div class="nw-comment-login">
        <p>შედით კომენტარის დასაწერად</p>
        <form class="nw-comment-signin" onsubmit="event.preventDefault();nwSignIn()">
          <input type="email" id="nwSigninEmail" placeholder="ელ. ფოსტა" autocomplete="email" />
          <input type="password" id="nwSigninPass" placeholder="პაროლი" autocomplete="current-password" />
          <button type="submit" class="btn btn-primary">შესვლა</button>
        </form>
        <div class="nw-comment-error" id="nwSigninError"></div>
        <p class="nw-comment-register-hint">არ გაქვს ანგარიში? <a href="/ufc/">დარეგისტრირდი აქ</a></p>
      </div>`;
  }
}

// Sign-in only, deliberately -- registration (doRegister() in app.js)
// validates nick uniqueness, phone, birth year/18+ gate, gender, plus
// IP capture and Meta CAPI tracking. Reimplementing all of that here
// would be exactly the "logic Giorgi has to maintain in two places"
// this task said to avoid. Someone without an account yet is pointed
// to /ufc/, where that full flow already lives; someone who already
// has one can sign in right here without leaving the article.
async function nwSignIn() {
  const email = (document.getElementById('nwSigninEmail').value || '').trim();
  const pass = document.getElementById('nwSigninPass').value || '';
  const errEl = document.getElementById('nwSigninError');
  errEl.textContent = '';
  if (!email || !pass) { errEl.textContent = 'შეიყვანე ელ. ფოსტა და პაროლი'; return; }
  const { error } = await nwGetClient().auth.signInWithPassword({ email, password: pass });
  if (error) { errEl.textContent = 'არასწორი მეილი ან პაროლი'; return; }
  // onAuthStateChange (registered in nwInitComments) picks this up and re-renders.
}

async function nwLoadComments() {
  const { data, error } = await nwGetClient()
    .from('news_comments')
    .select('id,user_id,body,created_at')
    .eq('news_id', nwArticle.id)
    .eq('is_deleted', false)
    .order('created_at', { ascending: true });

  nwComments = error ? [] : (data || []);

  const ids = [...new Set(nwComments.map(c => c.user_id))];
  if (ids.length) {
    const { data: names } = await nwGetClient().from('news_commenter_names').select('id,nick').in('id', ids);
    (names || []).forEach(u => { nwCommenterNames[u.id] = u.nick; });
  }
  nwRenderComments();
}

function nwRenderComments() {
  const countEl = document.getElementById('nwCommentCount');
  if (countEl) countEl.textContent = nwComments.length;

  const box = document.getElementById('nwCommentsList');
  if (!box) return;
  if (!nwComments.length) { box.innerHTML = '<div class="nw-comment-empty">კომენტარი ჯერ არ არის — იყავი პირველი.</div>'; return; }

  box.innerHTML = nwComments.map(c => {
    const nick = nwCommenterNames[c.user_id] || 'Fan';
    const dateStr = new Date(c.created_at).toLocaleDateString('ka-GE', { year: 'numeric', month: 'short', day: 'numeric' });
    const canDelete = nwCurrentUser && (nwCurrentUser.id === c.user_id || nwCurrentUser.isAdmin);
    return `
    <div class="nw-comment">
      <div class="nw-comment-head">
        <span class="nw-comment-author">${nwEscapeHtml(nick)}</span>
        <span class="nw-comment-date">${dateStr}</span>
        ${canDelete ? `<button type="button" class="nw-comment-delete" onclick="nwDeleteComment('${c.id}')" title="წაშლა">🗑️</button>` : ''}
      </div>
      <div class="nw-comment-body">${nwEscapeHtml(c.body)}</div>
    </div>`;
  }).join('');
}

async function nwSubmitComment() {
  if (!nwCurrentUser) return;
  const input = document.getElementById('nwCommentInput');
  const errEl = document.getElementById('nwCommentFormError');
  const btn = document.getElementById('nwCommentSubmit');
  const body = (input.value || '').trim();
  errEl.textContent = '';
  if (!body) { errEl.textContent = 'დაწერე რამე კომენტარად'; return; }
  if (body.length > 1000) { errEl.textContent = 'მაქსიმუმ 1000 სიმბოლო'; return; }

  btn.disabled = true; input.disabled = true;
  const { data, error } = await nwGetClient()
    .from('news_comments')
    .insert({ news_id: nwArticle.id, user_id: nwCurrentUser.id, body })
    .select('id,user_id,body,created_at')
    .single();
  btn.disabled = false; input.disabled = false;

  if (error) { errEl.textContent = 'ვერ გაიგზავნა: ' + error.message; return; }

  input.value = '';
  const countSpan = document.getElementById('nwCommentCharCount');
  if (countSpan) countSpan.textContent = '0 / 1000';
  nwCommenterNames[nwCurrentUser.id] = nwCurrentUser.nick;
  nwComments.push(data);
  nwRenderComments();
}

async function nwDeleteComment(id) {
  if (!confirm('წაიშალოს კომენტარი?')) return;
  const { error } = await nwGetClient().from('news_comments').update({ is_deleted: true }).eq('id', id);
  if (error) { alert('წაშლა ვერ მოხერხდა: ' + error.message); return; }
  nwComments = nwComments.filter(c => c.id !== id);
  nwRenderComments();
}

async function nwLoad() {
  const params = new URLSearchParams(location.search);
  const slug = params.get('slug');
  if (!slug) { nwShowNotFound(); return; }

  // news_article_categories(category_id,news_categories(...)) embeds
  // the article's categories in the same request -- see
  // supabase/news_categories.sql for the two new FKs this relies on.
  const { data, error } = await nwGetClient()
    .from('news')
    .select('*,news_article_categories(category_id,news_categories(id,name_ka,name_en,slug))')
    .eq('slug', slug)
    .eq('is_published', true)
    .single();

  if (error || !data) { nwShowNotFound(); return; }
  nwArticle = data;
  nwRenderArticle();

  document.getElementById('nwCommentsWrap').style.display = 'block';
  await nwInitComments();
}

function nwShowNotFound() {
  document.getElementById('nwArt').innerHTML = `
    <a class="nw-back" href="/news/">← სიახლეები</a>
    <div class="nw-notfound">სტატია ვერ მოიძებნა.</div>`;
}

document.addEventListener('DOMContentLoaded', nwLoad);
</script>
