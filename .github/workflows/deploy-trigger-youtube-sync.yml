name: Deploy Trigger YouTube Sync Function

# Deploys supabase/functions/trigger-youtube-sync, the function
# EPJQI8FX/admin.html's "იუთუბის ვიდეოს სინქრონიზაცია" button calls to
# dispatch youtube-sync.yml immediately instead of waiting for its 6-hour
# cron. Same structure as deploy-trigger-prerender.yml -- one workflow per
# function, reusing the same GH_DISPATCH_TOKEN repository secret.

on:
  push:
    paths:
      - 'supabase/functions/trigger-youtube-sync/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set Edge Function secrets
        run: |
          supabase secrets set \
            GITHUB_DISPATCH_TOKEN="${{ secrets.GH_DISPATCH_TOKEN }}" \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} \
            --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Edge Function
        run: |
          supabase functions deploy trigger-youtube-sync \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} \
            --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
