name: Prerender News

# admin/news.html publishes straight to Supabase from the browser --
# it has no access to this repo, so nothing regenerates the static
# /news/<slug>/ pages or sitemap.xml automatically on publish. This
# polls on a schedule (same cadence family as the sport auto-scripts)
# and can also be run manually right after publishing an article.
#
# NOT RUN as part of this PRD pass -- written and reviewed locally
# only, per the hard constraint against triggering GitHub Actions in
# this session. See IMPLEMENTATION-SUMMARY.md "MANUAL STEPS".

on:
  # schedule disabled -- this workflow has never run in production and
  # must not start writing to the live site unsupervised. Restore with:
  #   schedule:
  #     - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  prerender:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install @supabase/supabase-js@2.49.1

      - name: Prerender published articles
        run: node scripts/prerender-news.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Prerender static pages (about/terms/privacy)
        run: node scripts/prerender-pages.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Sync news sitemap block
        run: node scripts/sync-news-sitemap.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Commit generated pages if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Explicit path list covering everything scripts/prerender-news.js
          # and scripts/prerender-pages.js write -- NOT `git add -A`/`.`.
          # news/ and en/news/ are directories because the per-article
          # news/<slug>/ and en/news/<slug>/ subdirectories are created
          # dynamically (one per published article); every other path
          # here is a single fixed file.
          git add \
            news/ \
            en/news/ \
            sitemap.xml \
            index.html \
            ufc/index.html \
            f1/index.html \
            nba/index.html \
            football/epl/index.html \
            football/laliga/index.html \
            football/seriea/index.html \
            football/bundesliga/index.html \
            football/ligue1/index.html \
            football/ucl/index.html \
            about/index.html \
            terms/index.html \
            privacy/index.html
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Prerender news articles [automated]"
          git push
