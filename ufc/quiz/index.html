<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ქვიზი</title>
<!-- Task 1 (quiz URL restructure): this used to BE the quiz app; the app
     now lives at /quiz/, /quiz/ufcquiz/ and /quiz/footballquiz/ (real
     pages/files, so a direct visit or refresh works on static GitHub
     Pages). This file is kept only as a redirect, so every old bookmarked
     link and every already-shared PvP invite link
     (/ufc/quiz/?room=XXXX) keeps working -- query string (?room=, ?sport=,
     ?s=) and hash both carry over unchanged. noindex so this stub itself
     never outranks /quiz/ in search. -->
<meta name="robots" content="noindex" />
<link rel="canonical" href="https://fnf.ge/quiz/" />
<script>
  location.replace('/quiz/' + location.search + location.hash);
</script>
</head>
<body>
<p><a href="/quiz/">ქვიზი გადავიდა აქ</a></p>
</body>
</html>
